name: FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /public_html/
          state-name: .sync-ftp-state.json
          # Was true: every deploy wiped the server first, which deleted
          # config/google-reviews.php (git-ignored, lives only on the server)
          # and broke the reviews endpoint until it was re-uploaded by hand.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            config/google-reviews.php
            data/google-reviews-cache.json
            drnekin logo/**
