name: FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repo is public, so the API key can never be committed. It lives in
      # repository secrets and the config file is written here at deploy time.
      # Skipped when the secret is missing, so a half-configured run cannot
      # overwrite a working config on the server with an empty one.
      - name: Write Google reviews config
        env:
          PLACES_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
        run: |
          # The secrets context is not available in a step-level `if`, so the
          # guard lives here: without both values we write nothing and the
          # config already on the server survives (clean-slate is off).
          if [ -z "$PLACES_KEY" ] || [ -z "$PLACE_ID" ]; then
            echo "Google secrets missing - leaving the server config untouched."
            exit 0
          fi
          mkdir -p config
          cat > config/google-reviews.php <<PHP
          <?php
          // Generated by .github/workflows/deploy.yml - do not edit by hand.
          return [
              'places_api_key' => '${PLACES_KEY}',
              'place_id' => '${PLACE_ID}',
              // The key is HTTP-referrer restricted; server-side calls must send this.
              'referrer' => 'https://drnekinotoizmit.com/',
              'client_id' => '',
              'client_secret' => '',
              'refresh_token' => '',
              'account_id' => '',
              'location_id' => '',
              'cache_ttl' => 21600,
              'max_reviews' => 5,
          ];
          PHP
          # Second copy beside the endpoint: the config/ directory has not been
          # surviving the FTP sync on this host, api/ has.
          cp config/google-reviews.php api/google-reviews-config.php
          if command -v php >/dev/null 2>&1; then
            php -l config/google-reviews.php
            php -l api/google-reviews-config.php
          fi

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /public_html/
          state-name: .sync-ftp-state.json
          # Was true: every deploy wiped the server first, which deleted
          # config/google-reviews.php (git-ignored, lives only on the server)
          # and broke the reviews endpoint until it was re-uploaded by hand.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            data/google-reviews-cache.json
            drnekin logo/**
